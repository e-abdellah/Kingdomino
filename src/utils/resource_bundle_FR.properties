#GUI

##Klasse WelkomKDController:
###Methode registreerSpeler
nieuweSpelerRegistratieLabel=Inscription d'un nouveau joueur
voerGegevensSpelerIn=Entrez les informations du nouveau joueur :
naamSpelerLabel=Nom
geboortejaarSpelerLabel=Date de naissance
voerNaamSpelerIn=Entrez le nom du joueur : (le nom du joueur doit comporter au moins 6 caractères et ne doit pas consister uniquement en des espaces) :
voerGeboorteJaarSpelerIn=Entrez l'année de naissance du joueur (le joueur doit avoir au moins 6 ans) :
spelerSuccesvolGeregistreerd=L'enregistrement est terminé, le nouveau joueur a été enregistré avec succès.

###Methode registreerSpeler foutmeldingen:
GebruikersnaamError=Le nom d'utilisateur doit comporter au moins 6 caractères.
GeboortejaarGeenGetalError=L'année de naissance doit être un nombre.
GeboortejaarOngeldigError=Année de naissance invalide.
spelerGebruikersnaamAlInGebruik=Nom d'utilisateur déjà utilisé.

###Methode startSpel:
aantalSpelersDialogTitel=Nombre de joueurs
aantalSpelersDialogHeader=Combien de joueurs vont jouer ?
